name: Afghan Warrior Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

            - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Install Godot Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Fix Project Builder Path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("build_godot_project.py")
          s = p.read_text(encoding="utf-8")
          old = 'ROOT_DIR = os.path.abspath(os.path.join(os.path.dirname(__file__), ".."))'
          new = 'ROOT_DIR = os.path.abspath(os.path.dirname(__file__))'
          if old not in s:
              raise SystemExit("Expected ROOT_DIR line was not found.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Generate Godot Project
        run: |
          python build_godot_project.py
          test -f godot_project/AfghanWarrior/project.godot
          test -f godot_project/AfghanWarrior/export_presets.cfg

      - name: Configure Android Export
        run: |
          mkdir -p ~/.config/godot
          mkdir -p ~/.android

          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Build Android APK
        run: |
          cd godot_project/AfghanWarrior
          mkdir -p build
          godot --headless --editor --path . --quit
          godot --headless --path . --export-debug "Android" build/AfghanWarrior.apk
          test -f build/AfghanWarrior.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Warrior-Android-APK
          path: godot_project/AfghanWarrior/build/AfghanWarrior.apk
          if-no-files-found: error
